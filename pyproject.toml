[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "routeflow"
version = "0.1.0"
description = "Real-time logistics data platform with transactional delivery and replayable analytics"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0.38,<2.1",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3",
  "jsonschema>=4.23,<5", "google-cloud-pubsub>=2.28,<3",
  "google-cloud-bigquery>=3.30,<4", "google-cloud-storage>=3.1,<4",
  "dbt-core>=1.10,<1.12", "dbt-postgres>=1.9,<1.11", "dbt-bigquery>=1.9,<1.11",
  "httpx>=0.28,<1"
]

[project.optional-dependencies]
spark = ["pyspark==4.0.2"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-jsonschema>=4.23", "types-PyYAML>=6"]

[tool.hatch.build.targets.wheel]
packages = ["routeflow"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local PostgreSQL and Pub/Sub Emulator", "e2e: full local pipeline including dbt"]

