name: routeflow
version: '0.1.0'
config-version: 2
profile: routeflow
model-paths: [models]
test-paths: [tests]
macro-paths: [macros]
snapshot-paths: [snapshots]
clean-targets: [target, dbt_packages]
vars:
  lookback_days: 3
models:
  routeflow:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: analytics

